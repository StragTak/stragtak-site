:root{color-scheme:dark;--void:#0B0C0D;--bone:#EDEBE5;--steel:#8A9096;--amber:#FFB000;--tick:#3A4046}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--void);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--void);color:var(--bone);font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,4vw,40px);padding:72px 6vw 24px;text-align:center}
.logo{margin:0;width:min(86vw,880px);line-height:0}
.logo.sm{width:min(70vw,560px)}
.logo svg{display:block;width:100%;height:auto;overflow:visible}
.tagline{margin:0;font-size:clamp(20px,2.8vw,28px);line-height:1.2;letter-spacing:.01em;color:var(--steel)}
.status{margin:0;max-width:34em;font-size:clamp(15px,1.6vw,18px);line-height:1.5;color:var(--steel)}
footer{padding:0 6vw 28px;text-align:center;font-size:13px;line-height:1;color:var(--steel)}
.tick{position:fixed;width:28px;height:28px;border:2px solid var(--tick);pointer-events:none}
.t1{top:24px;left:24px;border-right:0;border-bottom:0}
.t2{top:24px;right:24px;border-left:0;border-bottom:0}
.t3{bottom:24px;right:24px;border-left:0;border-top:0}
.t4{bottom:24px;left:24px;border-right:0;border-top:0}
a{color:var(--bone);text-decoration:underline;text-decoration-color:var(--steel);text-underline-offset:5px}
a:hover{text-decoration-color:var(--amber)}
a:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.ping{fill:none;stroke:var(--amber);stroke-width:1.5px;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 2s ease-out .9s 3}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(4);opacity:0}}
@media (prefers-reduced-motion:reduce){.ping{animation:none}}
</style>
</head>
